name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # uncheck needs Node 22.20+ or 24.8+, and oxlint.config.ts needs type stripping
      - run: pnpm runtime set node 24

      - run: pnpm i

      - run: pnpm run check

  test_node_matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26, 24, 22, 20]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - run: pnpm runtime set node ${{ matrix.node-version }}

      - run: pnpm runtime set bun 1

      - run: pnpm runtime set deno 2

      - run: pnpm i

      - run: pnpm run test:coverage

      - uses: codecov/codecov-action@v7
        # TODO: use v26, there're tests skipped on v26
        if: matrix.node-version == 24
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  publish_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - run: pnpm i

      - run: pnpm exec pkg-pr-new publish './packages/*' --pnpm --compact --template './playgrounds/*'
